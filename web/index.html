<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syntone</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0e1116; --fg:#e8eaed; --dim:#8b93a1; --line:#262c36; --card:#161b22; --acc:#ffb000; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --fg:#14181f; --dim:#5b6472; --line:#d9dde3; --card:#fff; --acc:#b86e00; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; } p { color: var(--dim); }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:12px; color:var(--fg); text-decoration:none; }
  a.card b { color: var(--acc); } a.card span { display:block; color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Syntone</h1>
  <p>One live source, heard in sync on a fleet of devices. Research build: no audio is streamed yet.</p>
  <a class="card" href="/lab/"><b>Click test</b><span>Every device clicks on the same beat of the relay clock. Listen for a flam, or record and measure.</span></a>
</main>
</body>
</html>
